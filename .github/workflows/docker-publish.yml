name: Publish Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and publish (e.g. v0.5.0)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: itsashn/sloth-voice-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp version and commit
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          VERSION=$(echo "$TAG" | sed 's/^[vV]//')
          echo "Tag: $TAG  Version: $VERSION"
          git fetch origin master
          git checkout master
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version='$VERSION';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          sed -i "s|image: ghcr.io/itsashn/sloth-voice-server:.*|image: ghcr.io/itsashn/sloth-voice-server:v${VERSION}|" docker-compose.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json docker-compose.yml
          git diff --staged --quiet || git commit -m "chore: bump to v${VERSION} [skip ci]"
          git push origin master

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ inputs.version || github.ref_name }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha,prefix=sha-

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
